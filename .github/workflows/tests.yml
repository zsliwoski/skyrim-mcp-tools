name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core
            paths: tests/test_unit.py tests/test_books.py tests/test_edit_tools.py tests/test_maintenance.py tests/test_radiant.py             tests/test_radiant_story.py tests/test_maintenance_more.py tests/test_migrate_more.py tests/test_books_more.py tests/test_cells_more.py tests/test_quest_model.py tests/test_lore_cli.py tests/test_papyrus_api_cli.py tests/test_mediawiki.py tests/test_voice_audit.py tests/test_talking_object.py
          - name: spells
            paths: tests/test_enchant.py tests/test_spell.py tests/test_spell_set.py
          - name: authoring
            paths: tests/test_npc_tools.py tests/test_record_tools.py tests/test_quest_tools.py tests/test_package_tools.py tests/test_enchant_tools.py tests/test_spell_set_tools.py             tests/test_read_tools.py tests/test_kill_quest.py tests/test_plant_quest.py tests/test_radiant_builder_more.py tests/test_facegen.py tests/test_npc_builder_more.py
          - name: voice-editor
            paths: tests/test_voice_lines.py tests/test_asset_duplicator.py tests/test_assets_gui.py
    name: test (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests marked game or compiler need a Skyrim install and the Creation Kit, so CI leaves them out.
      # Tests marked fakegame run against the small master built in tests/fake_master.py instead.
      # A group made only of game tests leaves nothing to run, and pytest exits 5 then.
      - run: |
          python -m pytest ${{ matrix.group.paths }} -m "not game and not compiler"
          if ($LASTEXITCODE -eq 5) { exit 0 }
          exit $LASTEXITCODE
