name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests marked game or compiler need a Skyrim install and the Creation Kit, so CI leaves them out.
      - run: python -m pytest -m "not game and not compiler"
